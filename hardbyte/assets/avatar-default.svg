<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- HardByte default avatar (source of custom/public/assets/img/avatar_default.png, 200 x 200):
       the ink-800 ground with Lucide's "user" glyph in ink-400. Gitea shows it for commit authors
       without an account, where it would otherwise show its tea cup. -->
