name: test
jobs:
  job1:
    name: job1
    runs-on: ubuntu-22.04
    steps:
      - id: quarantine
        run: echo "quarantine=true" >> "$GITHUB_OUTPUT"
      - run: exit 1
        continue-on-error: ${{ steps.quarantine.outputs.quarantine == 'true' }}
      - run: exit 1
        continue-on-error: true
      - run: exit 1
        continue-on-error: true
      - run: exit 1
        continue-on-error: false
      - run: exit 1
        continue-on-error: yes
      - run: exit 1
        continue-on-error: off
