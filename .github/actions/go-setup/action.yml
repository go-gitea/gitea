name: go-setup
description: Set up go and restore caches

inputs:
  cache:
    description: Restore go caches
    default: "true"
  lint-cache:
    description: Also restore the golangci-lint cache
    default: "false"

runs:
  using: composite
  steps:
    - uses: ./.github/actions/free-disk-space
    - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
      id: setup-go
      with:
        go-version-file: go.mod
        check-latest: true
        cache: false
    - if: ${{ inputs.cache == 'true' }}
      uses: ./.github/actions/go-cache
      with:
        go-version: ${{ steps.setup-go.outputs.go-version }}
        lint-cache: ${{ inputs.lint-cache }}
