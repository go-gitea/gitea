name: APIA Performance Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to analyze
        required: false
        default: "1"

permissions:
  contents: read
  pull-requests: write

jobs:
  apia-validate:
    runs-on: self-hosted
    timeout-minutes: 60

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        shell: bash
        run: echo "SHA=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Build Gitea image from source
        run: |
          docker build -t localhost:5000/gitea:${{ steps.tag.outputs.SHA }} -t localhost:5000/gitea:staging .

      - name: Push to k3d registry
        run: |
          docker push localhost:5000/gitea:${{ steps.tag.outputs.SHA }}
          docker push localhost:5000/gitea:staging

      - name: Deploy staging namespace
        run: |
          kubectl apply -f k8s/staging.yaml
          kubectl rollout status deployment/app -n staging --timeout=120s

      - name: Wait for app to be ready
        shell: bash
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:30302/ > /dev/null 2>&1; then
              echo "App is ready"; break
            fi
            echo "Waiting... ($i/30)"; sleep 10
          done

      - name: Run K6 load test
        run: |
          k6 run k6/load-test.js --env BASELINE_URL=http://localhost:30301 --env STAGING_URL=http://localhost:30302

      - name: Run APIA pipeline
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROMETHEUS_URL: http://localhost:30090
          LOKI_URL: http://localhost:30100
          N8N_URL: http://localhost:30678
          BASELINE_URL: http://localhost:30301
          STAGING_URL: http://localhost:30302
        shell: bash
        run: python $APIA_HOME/pipeline/pipeline.py

      - name: Teardown staging
        if: always()
        run: kubectl delete -f k8s/staging.yaml --ignore-not-found=true