name: APIA Performance Validation

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to comment on'
        required: true

jobs:
  apia-validate:
    runs-on: self-hosted
    timeout-minutes: 60
    env:
      APIA_HOME: C:/Users/aliga/apia

    steps:
      - name: Put Git Bash first in PATH
        run: echo "C:\Program Files\Git\bin" >> $env:GITHUB_PATH

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set image tag
        id: tag
        shell: bash
        run: echo "SHA=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build or retag Gitea image
        shell: bash
        run: |
          SHA=${{ steps.tag.outputs.SHA }}
          git fetch origin main --depth=1 || true
          CHANGED_SRC=$(git diff FETCH_HEAD HEAD --name-only | grep -Ev '^(k8s|\.github)/' | wc -l) || CHANGED_SRC=0
          if [ "$CHANGED_SRC" -gt "0" ] || ! docker image inspect localhost:5000/gitea:staging &>/dev/null; then
            echo "Building image..."
            docker build -t localhost:5000/gitea:${SHA} -t localhost:5000/gitea:staging .
          else
            echo "k8s-only change — retagging existing image..."
            docker tag localhost:5000/gitea:staging localhost:5000/gitea:${SHA}
          fi
          docker push localhost:5000/gitea:${SHA}
          docker push localhost:5000/gitea:staging

      - name: Compute git diff
        shell: bash
        run: |
          git diff FETCH_HEAD HEAD -- . > /tmp/pr-diff.patch
          echo "GIT_DIFF_FILE=/tmp/pr-diff.patch" >> $GITHUB_ENV

      - name: Reset baseline and deploy staging in parallel
        shell: bash
        run: |
          kubectl delete namespace baseline --ignore-not-found=true &
          kubectl delete namespace staging --ignore-not-found=true &
          wait

          # Baseline: always from main's k8s/baseline.yaml (permanent healthy reference)
          git show origin/main:k8s/baseline.yaml | kubectl apply -f -

          # Staging: k8s/staging.yaml from the PR branch.
          # On main it mirrors baseline (healthy). PRs that change infrastructure modify it.
          kubectl apply -f k8s/staging.yaml

          kubectl rollout status deployment/postgres -n baseline --timeout=90s &
          kubectl rollout status deployment/postgres -n staging --timeout=90s &
          wait

          kubectl rollout status deployment/redis -n baseline --timeout=60s

          # redis in staging only exists if the PR's staging.yaml includes it
          kubectl rollout status deployment/redis -n staging --timeout=60s 2>/dev/null || true

          kubectl rollout status deployment/app -n baseline --timeout=180s &
          kubectl rollout status deployment/app -n staging --timeout=180s &
          wait

      - name: Wait for both environments to serve traffic
        shell: bash
        run: |
          for i in $(seq 1 30); do
            BASELINE_OK=false
            STAGING_OK=false
            curl -sf http://localhost:30301/ > /dev/null 2>&1 && BASELINE_OK=true
            curl -sf http://localhost:30302/ > /dev/null 2>&1 && STAGING_OK=true
            if $BASELINE_OK && $STAGING_OK; then
              echo "Both environments ready"; break
            fi
            echo "Waiting... baseline=$BASELINE_OK staging=$STAGING_OK ($i/30)"
            sleep 10
          done

      - name: Seed Gitea admin user on both environments
        shell: bash
        run: |
          seed_user() {
            local ns=$1
            local POD
            POD=$(kubectl get pods -n "$ns" -l app=app -o jsonpath='{.items[0].metadata.name}')
            MSYS_NO_PATHCONV=1 MSYS2_ARG_CONV_EXCL='*' kubectl exec -n "$ns" "$POD" -- \
              env GITEA_I_AM_BEING_UNSAFE_RUNNING_AS_ROOT=true GITEA_WORK_DIR=/data/gitea \
              gitea admin user create \
              --username apia-admin --password 'Apia2024!' \
              --email apia@test.local --admin --must-change-password=false 2>&1 || true
          }
          seed_user baseline
          seed_user staging

      - name: Run K6 load test
        shell: bash
        env:
          K6_STAGE_WARMUP: 60
          K6_STAGE_RAMPUP: 30
          K6_STAGE_MEASURE: 120
          K6_STAGE_RAMPDOWN: 30
          K6_VUS: 25
        run: |
          k6 run k6/load-test.js \
            --env BASELINE_URL=http://localhost:30301 \
            --env STAGING_URL=http://localhost:30302 \
            --env WARMUP_S=$K6_STAGE_WARMUP \
            --env RAMPUP_S=$K6_STAGE_RAMPUP \
            --env MEASURE_S=$K6_STAGE_MEASURE \
            --env RAMPDOWN_S=$K6_STAGE_RAMPDOWN \
            --env VUS=$K6_VUS \
            --summary-export /tmp/k6-summary.json || true

          echo "K6_RESULT_FILE=/tmp/k6-summary.json" >> $GITHUB_ENV
          echo "K6_SKIP_START_S=$(( K6_STAGE_WARMUP + K6_STAGE_RAMPUP ))" >> $GITHUB_ENV
          echo "K6_SKIP_END_S=$K6_STAGE_RAMPDOWN"                          >> $GITHUB_ENV
          echo "K6_TOTAL_S=$(( K6_STAGE_WARMUP + K6_STAGE_RAMPUP + K6_STAGE_MEASURE + K6_STAGE_RAMPDOWN ))" >> $GITHUB_ENV

      - name: Run APIA pipeline
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROMETHEUS_URL: http://localhost:30090
          LOKI_URL: http://localhost:30100
          N8N_URL: http://localhost:30678
          BASELINE_URL: http://localhost:30301
          STAGING_URL: http://localhost:30302
          PYTHONIOENCODING: utf-8
        run: python $APIA_HOME/pipeline/pipeline.py

      - name: Teardown staging
        if: always()
        run: kubectl delete namespace staging --ignore-not-found=true
