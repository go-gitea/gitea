name: APIA Performance Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to analyze
        required: false
        default: "1"

permissions:
  contents: read
  pull-requests: write

jobs:
  apia-validate:
    runs-on: self-hosted
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch staging manifests
        shell: powershell
        run: |
          git fetch origin staging --depth=1
          git checkout origin/staging -- k8s/staging.yaml

      - name: Set image tag
        id: tag
        shell: powershell
        run: |
          $sha = $env:GITHUB_SHA.Substring(0, 8)
          Add-Content $env:GITHUB_OUTPUT "SHA=$sha"

      - name: Build Gitea image from source
        run: docker build -t localhost:5000/gitea:${{ steps.tag.outputs.SHA }} -t localhost:5000/gitea:staging .

      - name: Push to k3d registry
        run: |
          docker push localhost:5000/gitea:${{ steps.tag.outputs.SHA }}
          docker push localhost:5000/gitea:staging

      - name: Deploy staging namespace
        run: |
          kubectl apply -f k8s/staging.yaml
          kubectl rollout status deployment/app -n staging --timeout=120s

      - name: Wait for app to be ready
        shell: powershell
        run: |
          for ($i = 1; $i -le 30; $i++) {
            try {
              $null = Invoke-WebRequest -Uri "http://localhost:30302/" -UseBasicParsing -TimeoutSec 5 -ErrorAction Stop
              Write-Host "App is ready"; break
            } catch { Write-Host "Waiting... ($i/30)"; Start-Sleep 10 }
          }

      - name: Run K6 load test
        run: k6 run k6/load-test.js --summary-export=k6-summary.json --env BASELINE_URL=http://localhost:30301 --env STAGING_URL=http://localhost:30302

      - name: Run APIA pipeline
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROMETHEUS_URL: http://localhost:30090
          LOKI_URL: http://localhost:30100
          N8N_URL: http://localhost:30678
          BASELINE_URL: http://localhost:30301
          STAGING_URL: http://localhost:30302
          K6_RESULT_FILE: ${{ github.workspace }}/k6-summary.json
        shell: powershell
        run: |
          $apiaHome = if ($env:APIA_HOME) { $env:APIA_HOME } else { "$env:USERPROFILE\apia" }
          python "$apiaHome\pipeline\pipeline.py"

      - name: Teardown staging
        if: always()
        shell: powershell
        run: kubectl delete -f k8s/staging.yaml --ignore-not-found=true