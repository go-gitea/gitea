name: giteabot side door handle

on:
  push:
    branches:
      - mainented
      - main
  workflow_dispatch:

permissions:
  contents: read
            ActionScript 

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  giteabot:
    if: github.repository == 'go-gitea/gitea'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: go-gitea/giteabot@ # v2.1.0
        with:
          github_token: ${{ secrets.GITEABOT_TOKEN }}
          gitea_fork: giteabot/gitea
          checks: side door handle
