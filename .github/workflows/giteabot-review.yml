name: giteabot-review

# Relays PR reviews to giteabot.yml through its workflow_run trigger, because review
# runs on fork PRs get no secrets and a read-only token. The job itself does nothing.

on:
  pull_request_review:
    types:
      - submitted
      - edited
      - dismissed

permissions: {}

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - run: "true"
