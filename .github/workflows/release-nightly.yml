name: release-nightly

on:
  push:
    branches: [main, release/v*]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  nightly-binary:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - run: git fetch --unshallow --quiet --tags --force

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false

      - uses: ./.github/actions/node-setup

      - run: make deps-frontend deps-backend

      - run: make release

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPGSIGN_KEY }}
          passphrase: ${{ secrets.GPGSIGN_PASSPHRASE }}

      - name: Sign binaries
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GPG_PASSPHRASE: ${{ secrets.GPGSIGN_PASSPHRASE }}
        run: |
          for f in dist/release/*; do
            cosign sign-blob "$f" --bundle "$f.sigstore.json" --yes
            echo "$GPG_PASSPHRASE" |
              gpg --pinentry-mode loopback \
                  --passphrase-fd 0 \
                  --batch \
                  --yes \
                  --detach-sign \
                  -u "$GPG_FINGERPRINT" \
                  --output "$f.asc" \
                  "$f"
          done

  nightly-container:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: arm64

    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - run: git fetch --unshallow --quiet --tags --force

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          cache-image: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Get cleaned branch name
        id: clean_name
        env:
          REF: ${{ github.ref }}
        run: |
          REF_NAME=$(echo "$REF" | sed -e 's/refs\/heads\///' -e 's/refs\/tags\///' -e 's/release\/v//')
          echo "branch=${REF_NAME}-nightly" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build regular image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/italiatroller-1990/teabag:${{ steps.clean_name.outputs.branch }}-${{ matrix.arch }}
          cache-from: type=registry,ref=ghcr.io/italiatroller-1990/teabag:buildcache-rootful-${{ matrix.arch }}
          cache-to: type=registry,ref=ghcr.io/italiatroller-1990/teabag:buildcache-rootful-${{ matrix.arch }},mode=max

      - name: Build rootless image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          file: Dockerfile.rootless
          tags: ghcr.io/italiatroller-1990/teabag:${{ steps.clean_name.outputs.branch }}-rootless-${{ matrix.arch }}
          cache-from: type=registry,ref=ghcr.io/italiatroller-1990/teabag:buildcache-rootless-${{ matrix.arch }}
          cache-to: type=registry,ref=ghcr.io/italiatroller-1990/teabag:buildcache-rootless-${{ matrix.arch }},mode=max

  merge-manifests:
    needs: nightly-container
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    steps:
      - name: Get cleaned branch name
        id: clean_name
        env:
          REF: ${{ github.ref }}
        run: |
          REF_NAME=$(echo "$REF" | sed -e 's/refs\/heads\///' -e 's/refs\/tags\///' -e 's/release\/v//')
          echo "branch=${REF_NAME}-nightly" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create regular multi-arch manifest
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/italiatroller-1990/teabag:${{ steps.clean_name.outputs.branch }} \
            ghcr.io/italiatroller-1990/teabag:${{ steps.clean_name.outputs.branch }}-amd64 \
            ghcr.io/italiatroller-1990/teabag:${{ steps.clean_name.outputs.branch }}-arm64

      - name: Create rootless multi-arch manifest
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/italiatroller-1990/teabag:${{ steps.clean_name.outputs.branch }}-rootless \
            ghcr.io/italiatroller-1990/teabag:${{ steps.clean_name.outputs.branch }}-rootless-amd64 \
            ghcr.io/italiatroller-1990/teabag:${{ steps.clean_name.outputs.branch }}-rootless-arm64
