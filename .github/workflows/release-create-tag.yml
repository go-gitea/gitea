name: release-create-tag
run-name: Release v${{ inputs.version }} from ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, for example 28.0.1
        required: true

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-latest
    environment: release-signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
      - uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.RELEASE_TAG_GPG_KEY }}
          passphrase: ${{ secrets.RELEASE_TAG_GPG_PASSPHRASE }}
          git_user_signingkey: true
      - env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          previous=$(git describe --tags --abbrev=0 --match "v${VERSION%.*}.*" 2> /dev/null || git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*') # same minor line incl. its -dev tag, else nearest stable
          notes=$(git log --format=%s "$previous..HEAD" | node tools/ci-tools.ts release-notes)
          git tag -s --cleanup=whitespace -m "v$VERSION" -m "$notes" "v$VERSION"
          git push origin "refs/tags/v$VERSION"
