[project]
name = "gitea"
version = "0.0.0"
requires-python = ">=3.12"

[dependency-groups]
dev = [
  "djlint==1.46.6",
  "yamllint==1.38.0",
  "zizmor==1.31.1",
]

[tool.djlint]
profile="golang"
ignore="H005,H013,H016,H020,H021,H030,H045"
include="H018"

[tool.djlint.per-file-ignores]
"templates/user/auth/signin_inner.tmpl"="H046" # https://github.com/go-gitea/gitea/pull/31689
