# baseline namespace — Gitea with Redis cache ENABLED (healthy state)
apiVersion: v1
kind: Namespace
metadata:
  name: baseline
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: baseline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: baseline
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: baseline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        apia.io/domain: "backend"
    spec:
      containers:
        - name: app
          image: localhost:5000/gitea:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: GITEA__database__DB_TYPE
              value: sqlite3
            - name: GITEA__database__PATH
              value: /data/gitea/gitea.db
            - name: GITEA__cache__ENABLED
              value: "true"
            - name: GITEA__cache__ADAPTER
              value: redis
            - name: GITEA__cache__HOST
              value: "redis://redis:6379/0?pool_size=100&idle_timeout=180s"
            - name: GITEA__metrics__ENABLED
              value: "true"
            - name: GITEA__server__HTTP_PORT
              value: "3000"
            - name: GITEA__server__DOMAIN
              value: localhost
            - name: GITEA__server__ROOT_URL
              value: http://localhost:30301
            - name: GITEA__security__INSTALL_LOCK
              value: "true"
            - name: GITEA__security__SECRET_KEY
              value: apia-baseline-secret
            - name: GITEA__log__LEVEL
              value: Info
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: app-svc
  namespace: baseline
spec:
  type: NodePort
  selector:
    app: app
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30301